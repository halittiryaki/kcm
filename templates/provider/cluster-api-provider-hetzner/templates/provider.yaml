{{- $global := .Values.global | default dict }}
{{- $version := .Chart.AppVersion }}
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: hetzner
spec:
  version: {{ $version }}
  {{- if .Values.configSecret.name }}
  configSecret:
    name: {{ .Values.configSecret.name }}
    namespace: {{ .Values.configSecret.namespace | default .Release.Namespace | trunc 63 }}
  {{- end }}
  manager: {{ include "spec.manager" . | nindent 4 }}
  {{- if $global.registry }}
  fetchConfig:
    oci: {{ $global.registry }}/capi/cluster-api-provider-hetzner-components:{{ $version }}
  deployment:
    containers:
      - name: manager
        imageUrl: {{ $global.registry }}/capi/cluster-api-hetzner-controller:{{ $version }}
  {{- else }}
  fetchConfig:
    {{- if .Values.fetchConfigUrl }}
    url: {{ .Values.fetchConfigUrl }}
    {{- else }}
    url: https://github.com/syself/cluster-api-provider-hetzner/releases/download/{{ $version }}/infrastructure-components.yaml
    {{- end }}
  deployment:
    containers:
      - name: manager
        imageUrl: {{ .Values.managerImage.repository }}:{{ .Values.managerImage.tag | default $version }}
        command:
          - /manager
        tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
  {{- end }}
