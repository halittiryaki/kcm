skipCreatingHetznerSecretInWorkloadCluster: false # @schema description: Indicates whether the Hetzner secret should be created in the workload cluster. type: boolean; required: true

hcloudSshKeys: # @schema description: HCloud SSH keys; type: array; minItems: 1; items: object
  - name: "" # @schema description: ssh key name in HCloud; type: string; required: true
    fingerprint: "" # @schema description: ssh key fingerprint in HCloud; type: string; required: false

# K0smotron parameters
k0smotron: # @schema description: K0smotron parameters; type: object
  controllerPlaneFlags: [] # @schema description: ControlPlaneFlags allows to configure additional flags for k0s control plane and to override existing ones. The default flags are kept unless they are overriden explicitly. Flags with arguments must be specified as a single string, e.g. --some-flag=argument; type: array; items: string
  mounts: [] # @schema description: Mounts allows to specify list of volumes with any files to be mounted in the controlplane pod. K0smotron allows any kind of volume, but the recommendation is to use secrets and configmaps.; type: array; items: object
  service: # @schema description: The API service configuration; type: object
    type: LoadBalancer # @schema description: An ingress methods for a service; type: string; enum: ClusterIP, NodePort, LoadBalancer; default: LoadBalancer
    apiHost: "localhost" # @schema description: The LB apiHost of the controlplane: string; default: localhost
    apiPort: 6443 # @schema description: The kubernetes API port. If empty k0smotron will pick it automatically; type: number; minimum: 1; maximum: 65535
    konnectivityPort: 8132 # @schema description: The konnectivity port. If empty k0smotron will pick it automatically; type: number; minimum: 1; maximum: 65535
  persistence: # @schema description: Persistence defines the persistence configuration. If empty k0smotron will use emptyDir as a volume (https://docs.k0smotron.io/stable/configuration/#persistence); type: object; required: false
    type: emptyDir
  addons: # @schema description: Configuration for installing any cluster addons as manifests or charts; type: object; required: false
    manifests: [] # @schema description: Manifests allows to specify list of volumes with manifests to be deployed in the cluster. (https://docs.k0smotron.io/stable/resource-reference/controlplane.cluster.x-k8s.io-v1beta1/#k0smotroncontrolplanespecmanifestsindex); type: object; required: false
    helm: # @schema description: Configuration of extension charts in k0s; type: object; required: false
      repositories: [] # @schema description: k0s extension repositories (https://docs.k0sproject.io/stable/helm-charts/#repository-configuration); type: array; items: object
      charts: [] # @schema description: k0s extension charts (https://docs.k0sproject.io/stable/helm-charts/#chart-configuration); type: array; items: object

# K0s parameters
k0s: # @schema description: K0s parameters; type: object
  version: v1.32.6+k0s.0 # @schema description: K0s version; type: string
  arch: amd64 # @schema description: K0s Download URL Arch; type: string; enum: amd64, arm64, arm; default: amd64
  workerArgs: [] # @schema description: Args specifies extra arguments to be passed to k0s worker. See: https://docs.k0sproject.io/stable/worker-node-config/ See: https://docs.k0sproject.io/stable/cli/k0s_worker/; type: array; items: string
  preStartCommands: [] # @schema description: PostStartCommands specifies commands to be run after starting k0s worker. See: https://docs.k0smotron.io/stable/resource-reference/bootstrap.cluster.x-k8s.io-v1beta1/#k0sworkerconfigtemplatespectemplatespec; type: array; items: string
  postStartCommands: [] # @schema description: PostStartCommands specifies commands to be run after starting k0s worker. See: https://docs.k0smotron.io/stable/resource-reference/bootstrap.cluster.x-k8s.io-v1beta1/#k0sworkerconfigtemplatespectemplatespec; type: array; items: string
  customUserDataRef: {} # @schema description: CustomUserDataRef is a reference to a secret or a configmap that contains the custom user data. Provided user-data will be merged with the one generated by k0smotron. Note that you may want to specify the merge type. See: https://cloudinit.readthedocs.io/en/latest/reference/merging.html; type: object; required: false
  api: # @schema description: Kubernetes API server parameters; type: object
    extraSans: [] # @schema description: Extra SANs to add; type: array; items: string;
    extraArgs: {} # @schema description: Map of key-values (strings) for any extra arguments to pass down to Kubernetes api-server process; type: object; additionalProperties: true
  network: # @schema description: Kubernetes cluster network configuration; type: object; additionalProperties: true
    provider: calico # @schema description: Network provider to use; type: string; examples: [kuberouter, calico, custom]; minLength: 1
    calico: # @schema description: Calico-specific configuration; type: object; additionalProperties: true
      mode: vxlan # @schema description: Calico network mode; type: string; examples: [ipip, vxlan, never]; minLength: 1
  