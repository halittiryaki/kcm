# Cluster parameters
clusterIdentity: # @schema description: The Hetzner credentials secret reference, auto-populated; type: object
  name: "" # @schema description: The Hetzner credentials secret name, auto-populated; type: string

clusterNetwork: # @schema description: The cluster network configuration; type: object
  apiServerPort: 6443 # @schema description: The port the API Server should bind to; type: number; minimum: 1; maximum: 65535
  pods: # @schema description: The network ranges from which Pod networks are allocated; type: object
    cidrBlocks: # @schema description: A list of CIDR blocks; type: array; items: string
      - "10.244.0.0/16"
  services: # @schema description: The network ranges from which service VIPs are allocated; type: object
    cidrBlocks: # @schema description: A list of CIDR blocks; type: array; items: string
      - "10.96.0.0/12"

clusterLabels: {} # @schema description: Labels to apply to the cluster; type: object; additionalProperties: true
clusterAnnotations: {} # @schema description: Annotations to apply to the cluster; type: object; additionalProperties: true

# Hetzner cluster parameters

additionalLabels: {} # @schema description: Additional set of labels to add to all the Hetzner resources; type: object; additionalProperties: false; patternProperties: {"^[a-zA-Z0-9._-]+$": {"type": "string"}}

# NOTE: 
# The CAPH currently does not provide an integrated way to select a pre-existing network.
# Only way at the moment is to: 
# - label a pre-existing network in Hetzner with `caph-cluster-<CLUSTER_NAME>=owned`
# - set `network.enabled: true`
#
# See [Issue 762](https://github.com/syself/cluster-api-provider-hetzner/issues/762)
# See [Issue 1472](https://github.com/syself/cluster-api-provider-hetzner/pull/1472)
# See [PR 1472](https://github.com/syself/cluster-api-provider-hetzner/pull/1472)
network: # @schema description: The network configuration; type: object; required: false
  enabled: false # @schema description: Enable Hetzner virtual network; type: boolean; required: true
  name: "" # @schema description: Network name; type: string; required: false
  cidrBlock: "10.0.0.0/16" # @schema description: Network CIDR; type: string; required: false
  subnetCidrBlock: "10.0.0.0/24" # @schema description: Subnet CIDR; type: string; required: false
  networkZone: "eu-central" # @schema description: Network Zone; type: string; enum: ["eu-central","us-east","us-west","ap-southeast"]; required: false

hcloudPlacementGroups:
  - name: default-spread
    type: spread

controlPlaneReplicas: 3 # @schema description: The number of the control plane pods; type: number; minimum: 1
controlPlaneRegions: [] # @schema description: Control plane regions (array of region identifiers); type: array;

# Hetzner machines parameters
nodepools: # @schema description: Node pool definitions; type: object
  cloud-pool: # @schema description: HCloud nodepool; type: object
    replicas: 2 # @schema description: Number of replicas for this nodepool; type: number; minimum: 0; required: true
    autoscaling: # @schema description: Autoscaling config for this nodepool; type: object; required: false
      enabled: false # @schema description: Enables autoscaling; type: boolean; default: false
      minSize: 1 # @schema description: Minimum replicas when autoscaling enabled; type: number; minimum: 0
      maxSize: 3 # @schema description: Maximum replicas when autoscaling enabled; type: number; minimum: 1
    placementGroupName: "default-spread" # @schema description: Placement group name for HCloud server; type: string
    machineType: "" # @schema description: The cloud instance type for HCloud server; type: string; required: true
    imageName: "" # @schema description: The image name to provision HCloud server; type: string; required: true
    publicNetwork: # @schema description: Specs about primary IP address of server. If both IPv4 and IPv6 are disabled, then the private network has to be enabled; type: object; required: false
      enableIPv4: false # @schema description: Defines whether server has IPv4 address enabled. As Hetzner load balancers require an IPv4 address, this setting will be ignored and set to true if there is no private net; type: bool; required: true
      enableIPv6: false # @schema description: Defines whether server has IPv6 address enabled; type: bool; required: false
    healthcheck: # @schema description: Machine healthcheck configuration for this nodepool; type: object
      enabled: true # @schema description: Enable node healthchecks for this nodepool; type: boolean; required: true
      maxUnhealthy: "100%" # @schema description: Maximum allowed unhealthy nodes (percentage string, e.g. "100%"); type: string; required: true
      nodeStartupTimeout: "10m" # @schema description: Duration to wait for a node to become Ready when booting (e.g. "10m"); type: string; required: false
      remediationStrategy: # @schema description: Remediation strategy applied when node is deemed unhealthy; type: object
        retryLimit: 1 # @schema description: Number of retries for remediation attempts; type: number; required: false
        timeout: "180s" # @schema description: Timeout for each remediation attempt (e.g. "180s"); type: string; required: true
        type: Reboot # @schema description: Type of remediation to perform; type: string; enum: [Reboot]; required: false

