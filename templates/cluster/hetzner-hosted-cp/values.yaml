  #       url: "" # @schema description: Remote URL of image. Can be tar, tar.gz, tar.bz, tar.bz2, tar.xz, tgz, tbz, txz; type: string; required: false
  #       path: "" # @schema description: Local path of a pre-installed image; type: string; required: false
  #     swraid: # @schema description: Configure software raid; type: object; required: false
  #       enabled: false # @schema description: Enables or disables software raid; type: boolean; required: false
  #       level: 0 # @schema description: Defines the software raid levels. Only relevant if raid is enabled. Pick one of 0,1,5,6,10; type: integer; required: false
  #     partitions: # @schema description: Partitions that should be created in installimage; type: array; required: true
  #       - mount: "" # @schema description: Mount defines the mount path of the filesystem; type: string; required: true
  #         fileSystem: "" # @schema description: Filesystem that should be used. Can be ext2, ext3, ext4, btrfs, reiserfs, xfs, swap, or the name of the LVM volume group, if the partition is a VG; type: string; required: true
  #         size: "" # @schema description: Size of the partition. Use 'all' to use all remaining space of the drive. M/G/T can be used as unit specifications for MiB, GiB, TiB; type: string; required: true
